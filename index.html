<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <link rel="stylesheet" href="styles.css" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="script.js"></script>
  </head>
  <body class="light-mode">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

  <script src="https://kit.fontawesome.com/46ae2beeb9.js" crossorigin="anonymous"></script>

    <main>
      
      <div class="container text-center mt-5">
        <button id="dark-mode-toggle" class="btn">
            <i class="fa-solid fa-circle-half-stroke"></i>
        </button>

      <div class="container my-4">

        <h1 class="text-center text-success mb-4">
          Daily Task Conqueror
        </h1>
      
        <h2 class="text-center text-success mb-2">
          What is your task?
        </h2>
      
        <div class="d-flex justify-content-center mb-4">
          <input
            class="form-control w-75"
            list="datalistOptions"
            id="exampleDataList"
            placeholder="My Task is..."
          >
          <datalist id="datalistOptions">
            <option value="Clean Space">
            <option value="Organize">
            <option value="Cook Meal">
            <option value="Study">
            <option value="Wash Clothes">
          </datalist>
        </div>
      
        <h2 class="text-center text-success mt-4">
          What is your energy level today?
        </h2>

        <div class="d-flex justify-content-center gap-4">
          <button class="btn btn-success btn-lg">Low</button>
          <button class="btn btn-success btn-lg">Normal</button>
          <button class="btn btn-success btn-lg">High</button>
        </div>
        
        <div class="text-center mt-4">
          <input class="btn btn-success btn-lg" type="submit" value="Submit">
        </div>
      
      </div>

    </main>
  </body>
</html>
